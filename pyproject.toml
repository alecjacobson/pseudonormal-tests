[project]
name = "pseudonormal-tests"
version = "0.1.0"
description = "Reproducible libigl pseudonormal and fast winding number benchmarks on Thingi10K"
requires-python = ">=3.12"
dependencies = [
    "filelock>=3.0,<5",
    "huggingface-hub>=1.0,<2",
    "libigl>=2.6,<3",
    "numpy>=2.0,<3",
]

[dependency-groups]
dev = ["ruff>=0.14"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
